<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact form</title>
<style>
  :root { --bg:#f3f5f7; --card:#ffffff; --text:#1d2733; --muted:#5b6876; --line:#cfd6dd; --accent:#1f6f5c; --accent-bg:#e6f4ef; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:"Segoe UI", Roboto, Arial, sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); padding:32px; border:1px solid var(--line); border-radius:8px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  label { display:block; margin:16px 0 6px; font-weight:600; font-size:.95rem; }
  input, textarea { width:100%; padding:10px 12px; font:inherit; color:var(--text); border:1px solid var(--line); border-radius:6px; background:#fff; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  textarea { min-height:110px; resize:vertical; }
  button { margin-top:24px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #error { margin-top:16px; color:var(--err); font-weight:600; min-height:1.4em; }
  #success { display:none; text-align:center; background:var(--accent-bg); border:1px solid var(--accent); border-radius:8px; padding:32px 24px; }
  #success h2 { margin:0 0 8px; color:var(--accent); }
  #success p { margin:0; color:var(--text); }
  #success button { margin-top:20px; background:#fff; color:var(--accent); border:1px solid var(--accent); }
</style>
</head>
<body>
<div class="card">

  <form id="contactForm" novalidate>
    <input type="hidden" name="source" value="form2">
    <h1>Get in touch</h1>
    <p class="sub">Send us a message and we’ll reply by email.</p>

    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel">

    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>

    <button type="submit" id="btn">Send message</button>
    <div id="error" role="alert"></div>
  </form>

  <div id="success" role="status">
    <h2>Submitted successfully</h2>
    <p>Thank you, <span id="who"></span>. We’ve received your message and sent a confirmation to your email.</p>
    <button type="button" id="again">Submit another response</button>
  </div>

</div>

<script>
  // PASTE YOUR n8n PRODUCTION URL HERE (it contains /webhook/ and NOT /webhook-test/)
  const WEBHOOK_URL = "YOUR_PRODUCTION_URL";

  const form = document.getElementById("contactForm");
  const btn = document.getElementById("btn");
  const errorBox = document.getElementById("error");
  const successBox = document.getElementById("success");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.textContent = "";
    btn.disabled = true;
    btn.textContent = "Sending…";

    const data = Object.fromEntries(new FormData(form).entries());

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      const result = await res.json().catch(() => ({}));

      if (res.ok) {
        document.getElementById("who").textContent = data.name || "there";
        form.style.display = "none";
        successBox.style.display = "block";
        form.reset();
      } else {
        errorBox.textContent = result.message || "Something went wrong. Please try again.";
      }
    } catch (err) {
      errorBox.textContent = "Could not reach the server. Check the webhook URL and CORS setting.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Send message";
    }
  });

  document.getElementById("again").addEventListener("click", () => {
    successBox.style.display = "none";
    form.style.display = "block";
  });
</script>
</body>
</html>
